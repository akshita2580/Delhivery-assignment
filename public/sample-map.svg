<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f9ff"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Buildings/Rooms -->
  <rect x="50" y="50" width="150" height="100" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="5"/>
  <text x="125" y="105" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="bold">Warehouse A</text>
  
  <rect x="250" y="50" width="150" height="100" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="5"/>
  <text x="325" y="105" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="bold">Warehouse B</text>
  
  <rect x="450" y="50" width="150" height="100" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="5"/>
  <text x="550" y="105" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="bold">Warehouse C</text>
  
  <!-- Charging Stations -->
  <circle cx="125" cy="200" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="205" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">⚡</text>
  
  <circle cx="325" cy="200" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="325" y="205" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">⚡</text>
  
  <circle cx="550" cy="200" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="205" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">⚡</text>
  
  <!-- Paths/Roads -->
  <rect x="0" y="250" width="800" height="30" fill="#94a3b8" opacity="0.5"/>
  <rect x="0" y="400" width="800" height="30" fill="#94a3b8" opacity="0.5"/>
  <rect x="400" y="0" width="30" height="600" fill="#94a3b8" opacity="0.5"/>
  
  <!-- Labels -->
  <text x="400" y="240" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Main Corridor</text>
  <text x="400" y="390" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Secondary Corridor</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="bold">Sample Warehouse Map</text>
</svg>


